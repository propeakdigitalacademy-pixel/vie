name: Explicit npm release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to request publication
        required: true
      version:
        description: Exact package version to publish
        required: true
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Maintainer must configure required reviewers on this environment.
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release commit from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/portable-lockfile.mjs
      - run: npm ci
      - name: Verify licensing, version and release channel
        id: release
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: node scripts/release-gate.mjs
      - name: Verify npm authentication without displaying the token
        run: npm whoami --registry=https://registry.npmjs.org > /dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run check
      - run: npm run format:check
      - run: npm pack --dry-run
      - name: Publish only after explicit request and environment approval
        run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
